services:
  api:
    build: ./app
    ports:
      - "3000:3000"
    environment:
      PGHOST: db
    depends_on:
      - db

  db:
    image: alpine/sqlite:3.53.4
    environment:
      SQLITE_USER: ${SQLITE_USER}
      SQLITE_PASSWORD: ${SQLITE_PASSWORD}
      SQLITE_DB: ${SQLITE_DB}
    volumes:
      - donnees-td4:/var/lib/postgresql

volumes:
  donnees-td4: